<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Join Our Team - Ravonics</title></head>
<body style="font-family:Calibri,Arial,sans-serif;max-width:720px;margin:40px auto;padding:24px;">
<h1 style="color:#93242A;">Join Our Team</h1>
<p style="color:#5d6371;">Complete this form to request to join Ravonics and provide a Letter of Commitment.</p>
<form action="/api/loc-submit" method="post" enctype="multipart/form-data">
<label>Full Name<br><input type="text" name="name" required style="width:100%;padding:8px;margin:4px 0 12px;"></label>
<label>Email<br><input type="email" name="email" required style="width:100%;padding:8px;margin:4px 0 12px;"></label>
<label>Role/Title<br><input type="text" name="role" style="width:100%;padding:8px;margin:4px 0 12px;"></label>
<label>Organization<br><input type="text" name="org" style="width:100%;padding:8px;margin:4px 0 12px;"></label>
<label>Project of Interest<br><input type="text" name="project" style="width:100%;padding:8px;margin:4px 0 12px;"></label>
<label>Letter of Commitment (PDF/DOCX)<br><input type="file" name="loc" accept=".pdf,.docx" required style="margin:4px 0 12px;"></label>
<label><input type="checkbox" name="consent" required> I consent to Ravonics using my information and LoC for proposal submissions.</label><br><br>
<button type="submit" style="background:#93242A;color:#fff;border:none;padding:12px 24px;border-radius:6px;font-weight:bold;">Submit</button>
</form>
</body></html>
