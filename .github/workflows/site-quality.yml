name: Site quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Node 26 quality and customer journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install proxy dependencies
        run: npm ci --prefix proxy

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: Run site quality suite
        run: npm run test:all

      - name: Verify the publish artifact is clean and provenance-bound
        run: ./scripts/verify-ghpages-clean.sh build/site

      - name: Verify release provenance
        run: npm run release:check

  node-24-production:
    name: Node 24 production compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 24 production lane
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Install proxy dependencies
        run: npm ci --prefix proxy

      - name: Check and build with Node 24
        run: npm run check && npm run build && npm run release:check && ./scripts/verify-ghpages-clean.sh build/site

      - name: Run proxy tests with Node 24
        run: npm run test:proxy
